[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-comemo"
version = "1.0.0"
description = "Composite Memory Meta-Provider for Hermes Agent — multiplex Honcho, Mem0, and Supermemory simultaneously"
authors = [{ name = "AndaLabX", email = "anda@andalabx.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "honcho-ai>=2.0.1,<3",
    "mem0ai>=2.0.10,<3",
    "supermemory>=5.0.0,<6",
    "requests>=2.31,<3",
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    "certifi>=2024.0,<2027",
    "hindsight-client>=0.10.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/andausman/comemo"
Repository = "https://github.com/andausman/comemo.git"

[project.entry-points."hermes_agent.memory_providers"]
comemo = "comemo:register"

[tool.setuptools.packages.find]
include = ["comemo*"]

[tool.setuptools.package-data]
comemo = ["plugin.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "TID", "RUF", "PERF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "C4"]
"**/__init__.py" = ["F401"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = false

[tool.pytest.ini_options]
markers = [
    "unit: no external dependencies",
    "integration: hits a live backend API",
]
testpaths = ["tests"]
